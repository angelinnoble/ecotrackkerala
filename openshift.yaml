apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: ecotrack-image
  namespace: angelinnoble2028-dev
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: ecotrack-build
  namespace: angelinnoble2028-dev
spec:
  source:
    type: Binary
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Dockerfile
  output:
    to:
      kind: ImageStreamTag
      name: ecotrack-image:latest
  triggers:
    - type: ConfigChange
    - type: ImageChange
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecotrack-deploy
  namespace: angelinnoble2028-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ecotrack
  template:
    metadata:
      labels:
        app: ecotrack
    spec:
      containers:
        - name: ecotrack
          image: image-registry.openshift-image-registry.svc:5000/angelinnoble2028-dev/ecotrack-image:latest
          ports:
            - containerPort: 80
          # Optional health checks
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ecotrack-svc
  namespace: angelinnoble2028-dev
spec:
  selector:
    app: ecotrack
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: ecotrack
  namespace: angelinnoble2028-dev
spec:
  to:
    kind: Service
    name: ecotrack-svc
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect

